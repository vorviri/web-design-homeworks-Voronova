<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FurniPM Workspace</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">🪑 PM</div>
    <div class="sidebar-user">
      <div class="avatar">ВВ</div>
      <span>Воронова В.</span>
      <span class="user-role">Product Designer</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active">📊 Дашборд</a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h1 class="page-title">Рабочее пространство</h1>
        <p class="page-subtitle">Проект: Спальня</p>
      </div>
    </header>

    <div class="widget-controls">
      <button id="add-todo" class="widget-btn-add">📋 Задачи</button>
      <button id="add-quote" class="widget-btn-add">💡 Вдохновение</button>
      <button id="add-deadlines" class="widget-btn-add">⏱ Дедлайны</button>
      <button id="add-currency" class="widget-btn-add">💱 Курс</button>
      <button id="add-palette" class="widget-btn-add">🎨 Палитра</button>
    </div>

    <div id="dashboard-grid" class="grid"></div>
    <div id="empty-state" class="empty-state">
      <h3>Добавьте виджеты для управления проектом</h3>
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
